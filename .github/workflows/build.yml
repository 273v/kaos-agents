name: build

# Standard `build` lane (per
# kaos-modules/docs/oss/40-ci-cd/runner-cost-reduction-plan.md):
# build wheel/sdist, `twine check --strict`, clean-venv smoke install.
# Linux Python 3.13 on PR / main push / tag. The release workflow
# (release.yml) is the gated artifact-publish path; this lane is the
# PR-time smoke that the artifact builds cleanly and the wheel
# installs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build wheel and sdist
        run: uv build

      - name: Verify metadata
        run: uvx --from twine twine check --strict dist/*

      - name: Smoke-test the built wheel in a clean venv
        # Install the actually-built wheel (not the source tree) into a
        # clean Python environment and exercise the public API. This
        # catches packaging bugs that source-tree tests miss: missing
        # data files, broken `__init__.py` exports, sdist-only files
        # that reference dist-only paths, etc.
        #
        # `[llm,mcp,api]` is installed because the top-level
        # `kaos_agents` package eagerly imports `kaos_llm_core` (via
        # `kaos_agents.action.actor`), `kaos_mcp` (via the tool
        # registry), and `fastapi` (via `kaos_agents.api.wire`'s
        # sibling import of `kaos_agents.api.server.create_app`).
        # These are declared as optional extras in pyproject.toml
        # today but are de facto hard deps at import time. Tracked
        # as a Phase D follow-up to either make the imports lazy or
        # promote all three to runtime deps.
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "$(ls dist/kaos_agents-*-py3-none-any.whl)[llm,mcp,api]"
          /tmp/smoke/bin/python -c "
          import kaos_agents
          assert kaos_agents.__version__, 'version missing from wheel'
          # Public symbols import without error.
          from kaos_agents import (
              Agent,
              AgentPattern,
              AgentResponse,
              ChatAgent,
              KaosAgent,
              PlanExecuteAgent,
              ResearchAgent,
              Runner,
              SessionMemory,
              register_agent_tools,
          )
          # Runtime container resolves and agent tools register.
          from kaos_core import KaosRuntime
          rt = KaosRuntime()
          n = register_agent_tools(rt)
          assert n > 0, 'no agent tools registered'
          print(f'kaos-agents {kaos_agents.__version__}: {n} agent tools registered')
          "
          # Exercise the CLI entrypoint.
          /tmp/smoke/bin/kaos-agent --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
