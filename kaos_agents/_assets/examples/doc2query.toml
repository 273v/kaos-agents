# Few-shot Example pool for PredictDocumentQueriesSignature (doc2query).
# Loaded by kaos_agents.context.doc2query via load_examples("doc2query").
#
# Teaches the predictor to emit short, lookup-style queries the document
# would answer — not summaries, not paraphrases, not yes/no questions.

[[example]]
name = "legal_filing_three_topic_queries"
description = "Court-opinion excerpt; predict the three queries a researcher would type to find this passage."

[example.inputs]
document_excerpt = "Marbury v. Madison, 5 U.S. (1 Cranch) 137 (1803). The Court held that Section 13 of the Judiciary Act of 1789, which authorized the Supreme Court to issue writs of mandamus to executive officers, was unconstitutional because it expanded the Court's original jurisdiction beyond Article III."

[example.outputs]
predicted_queries = [
    "Marbury v. Madison judicial review holding",
    "Judiciary Act of 1789 Section 13 unconstitutional",
    "Article III original jurisdiction limits Supreme Court",
]


[[example]]
name = "regulatory_notice_lookup_queries"
description = "Regulatory text; predict queries someone tracking the rule would issue."

[example.inputs]
document_excerpt = "The SEC adopted final rules requiring registrants to disclose Scope 1 and Scope 2 GHG emissions in their annual reports (10-K), effective for large accelerated filers beginning with fiscal years starting on or after January 1, 2026."

[example.outputs]
predicted_queries = [
    "SEC climate disclosure rule effective date",
    "Scope 1 Scope 2 GHG emissions 10-K requirement",
    "large accelerated filer climate disclosure compliance year",
]


[[example]]
name = "contract_clause_drafting_queries"
description = "Contract excerpt; predict queries a drafter would search."

[example.inputs]
document_excerpt = "Section 7.1 (Governing Law). This Agreement shall be governed by and construed in accordance with the laws of the State of Delaware, without regard to its conflict of laws principles. The parties consent to exclusive jurisdiction in the courts of New Castle County, Delaware."

[example.outputs]
predicted_queries = [
    "Delaware governing law clause sample",
    "exclusive jurisdiction New Castle County boilerplate",
    "conflict of laws waiver standard wording",
]
