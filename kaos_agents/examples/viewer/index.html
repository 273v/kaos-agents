<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kaos-agents Run Inspector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind config — opt-in dark mode via class on <html>.
    tailwind.config = { darkMode: 'class' };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@latest/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    /* Minimal custom CSS — Tailwind utility classes do the rest. */
    [x-cloak] { display: none !important; }
    pre.json { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .json-key { color: #93c5fd; }
    .json-str { color: #86efac; }
    .json-num { color: #fcd34d; }
    .json-bool { color: #f9a8d4; }
    .json-null { color: #fca5a5; }
    html:not(.dark) .json-key { color: #1d4ed8; }
    html:not(.dark) .json-str { color: #047857; }
    html:not(.dark) .json-num { color: #b45309; }
    html:not(.dark) .json-bool { color: #be185d; }
    html:not(.dark) .json-null { color: #b91c1c; }
    .markdown-body { font-size: 13px; line-height: 1.55; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 0.5rem; margin-bottom: 0.25rem; }
    .markdown-body h1 { font-size: 1.05rem; }
    .markdown-body h2 { font-size: 1rem; }
    .markdown-body h3 { font-size: 0.95rem; }
    .markdown-body p { margin-bottom: 0.5rem; }
    .markdown-body ul, .markdown-body ol { margin-left: 1.25rem; margin-bottom: 0.5rem; list-style: revert; }
    .markdown-body code { background: rgba(127,127,127,0.15); padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
    .markdown-body pre { background: rgba(127,127,127,0.12); padding: 8px; border-radius: 4px; overflow-x: auto; margin-bottom: 0.5rem; }
    .markdown-body table { border-collapse: collapse; margin-bottom: 0.5rem; font-size: 12px; }
    .markdown-body th, .markdown-body td { border: 1px solid rgba(127,127,127,0.35); padding: 3px 6px; }
    .markdown-body th { background: rgba(127,127,127,0.12); }
    .trace-stripe { box-shadow: inset 3px 0 0 0 var(--stripe, transparent); }
    .row-selected { background: rgba(99,102,241,0.18) !important; }
    .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(127,127,127,0.35); border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen"
      x-data="viewer()" x-init="init()" @keydown.window="onKey($event)">

  <!-- ============================= HEADER ============================= -->
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-md bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center text-white font-bold text-sm">K</div>
        <div>
          <div class="font-semibold text-sm leading-none">kaos-agents</div>
          <div class="text-[11px] text-slate-500 dark:text-slate-400 leading-none mt-0.5">Run Inspector</div>
        </div>
      </div>
      <div class="flex-1"></div>
      <template x-if="fileName">
        <div class="text-xs text-slate-500 dark:text-slate-400 truncate max-w-md" x-text="fileName"></div>
      </template>
      <button @click="toggleTheme()" class="text-xs px-2 py-1 rounded border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
        <span x-show="theme === 'dark'">Light</span><span x-show="theme === 'light'">Dark</span>
      </button>
      <button @click="reset()" x-show="records.length > 0" class="text-xs px-2 py-1 rounded border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">Reset</button>
    </div>
  </header>

  <!-- ============================= EMPTY STATE / LOADER ============================= -->
  <template x-if="records.length === 0">
    <main class="max-w-3xl mx-auto px-4 py-12">
      <h1 class="text-2xl font-semibold mb-2">Drop a kaos-agents JSONL recording to inspect it.</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-8">
        Every LLM call routed through <code class="text-xs px-1 py-0.5 bg-slate-200 dark:bg-slate-800 rounded">kaos-llm-core</code>
        is captured by the streaming recorder when
        <code class="text-xs px-1 py-0.5 bg-slate-200 dark:bg-slate-800 rounded">KAOS_LLM_CORE_RECORDER_DIR</code>
        is set. This viewer hydrates the JSONL into a per-call timeline with cost, tokens, inputs, outputs, and trace grouping.
      </p>

      <div @dragover.prevent="dragHover=true" @dragleave="dragHover=false" @drop.prevent="onDrop($event)"
           :class="dragHover ? 'border-indigo-500 bg-indigo-50/40 dark:bg-indigo-900/20' : 'border-slate-300 dark:border-slate-700'"
           class="border-2 border-dashed rounded-xl p-10 text-center transition">
        <div class="text-base font-medium mb-1">Drag &amp; drop a <code class="text-xs px-1 py-0.5 bg-slate-200 dark:bg-slate-800 rounded">.jsonl</code> file here</div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mb-4">or use one of the loaders below</div>
        <div class="flex flex-wrap gap-2 justify-center">
          <label class="text-sm px-3 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer">
            Choose file...
            <input type="file" accept=".jsonl,.json,application/x-ndjson,application/jsonl" class="hidden" @change="onFile($event)" />
          </label>
          <button class="text-sm px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800" @click="pasteOpen=true">
            Paste JSONL...
          </button>
          <button class="text-sm px-3 py-1.5 rounded-md border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800" @click="loadSample()">
            Load sample
          </button>
        </div>
      </div>

      <template x-if="urlHint">
        <div class="mt-6 text-xs p-3 rounded-md bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800">
          The <code>?file=</code> URL parameter is a hint; this page can only read same-origin files
          served via HTTP. Run <code class="bg-amber-100 dark:bg-amber-900 px-1 rounded">python -m kaos_agents.examples.viewer &lt;path&gt;</code>
          to launch a local server, or drag-and-drop the file above.
        </div>
      </template>

      <template x-if="loadError">
        <div class="mt-6 text-xs p-3 rounded-md bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800" x-text="loadError"></div>
      </template>

      <template x-if="parseErrors.length > 0">
        <div class="mt-6 text-xs p-3 rounded-md bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800">
          <div class="font-semibold mb-1" x-text="`Parse errors (${parseErrors.length} of ${totalLines} lines)`"></div>
          <ul class="space-y-1">
            <template x-for="e in parseErrors.slice(0, 10)" :key="e.line">
              <li>Line <span x-text="e.line"></span>: <span class="text-rose-500" x-text="e.error"></span></li>
            </template>
          </ul>
        </div>
      </template>
    </main>
  </template>

  <!-- ============================= MAIN ============================= -->
  <template x-if="records.length > 0">
    <main class="max-w-[1600px] mx-auto px-4 py-4">

      <!-- Summary stats -->
      <section class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-2 mb-4">
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Invocations</div>
          <div class="text-lg font-semibold" x-text="invocations.length"></div>
        </div>
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Total cost</div>
          <div class="text-lg font-semibold" x-text="'$' + summary.totalCost.toFixed(4)"></div>
        </div>
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Total tokens</div>
          <div class="text-lg font-semibold" x-text="summary.totalTokens.toLocaleString()"></div>
        </div>
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">LLM elapsed</div>
          <div class="text-lg font-semibold" x-text="fmtMs(summary.totalLatencyMs)"></div>
        </div>
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Traces</div>
          <div class="text-lg font-semibold" x-text="summary.traceCount"></div>
        </div>
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Errors</div>
          <div class="text-lg font-semibold" :class="summary.errorCount > 0 ? 'text-rose-500' : ''" x-text="summary.errorCount"></div>
        </div>
        <div class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Time range</div>
          <div class="text-sm font-medium" x-text="summary.timeRangeLabel"></div>
        </div>
      </section>

      <!-- Schema / models / signatures badges -->
      <section class="flex flex-wrap items-center gap-2 mb-4 text-xs">
        <template x-if="header">
          <span class="px-2 py-1 rounded bg-indigo-100 dark:bg-indigo-900/50 text-indigo-800 dark:text-indigo-200">
            schema v<span x-text="header.schema_version"></span>
          </span>
        </template>
        <template x-if="header && header.streaming">
          <span class="px-2 py-1 rounded bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-200">streaming</span>
        </template>
        <template x-if="header && header.redaction_enabled">
          <span class="px-2 py-1 rounded bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-200"
                :title="`Threshold: ${header.redaction_threshold_chars} chars`">
            redaction on (≥<span x-text="header.redaction_threshold_chars"></span> chars)
          </span>
        </template>
        <template x-if="header && !header.redaction_enabled">
          <span class="px-2 py-1 rounded bg-rose-100 dark:bg-rose-900/50 text-rose-800 dark:text-rose-200">redaction OFF</span>
        </template>
        <template x-if="trailer">
          <span class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">trailer present</span>
        </template>
        <span class="text-slate-400">·</span>
        <template x-for="m in summary.models" :key="m.name">
          <span class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            <span class="font-mono" x-text="m.name"></span>
            <span class="text-slate-500 ml-1" x-text="`(${m.count})`"></span>
          </span>
        </template>
        <span class="text-slate-400">·</span>
        <template x-for="s in summary.signatures" :key="s.name">
          <span class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            <span x-text="s.name"></span>
            <span class="text-slate-500 ml-1" x-text="`(${s.count})`"></span>
          </span>
        </template>
      </section>

      <!-- Filters -->
      <section class="rounded-md p-3 mb-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
        <div class="flex flex-wrap items-center gap-3">
          <input type="search" placeholder="Search inputs / outputs / errors (press / to focus)"
                 x-model="filters.search" x-ref="searchInput"
                 class="flex-1 min-w-[240px] text-sm px-3 py-1.5 rounded-md bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <select x-model="filters.status" class="text-sm px-2 py-1.5 rounded-md bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            <option value="all">All status</option>
            <option value="ok">OK only</option>
            <option value="error">Errors only</option>
          </select>
          <label class="text-xs flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" x-model="filters.groupByTrace" class="rounded" />
            Group by trace_id
          </label>
          <button class="text-xs px-2 py-1 rounded border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800" @click="advanced=!advanced">
            <span x-show="!advanced">More filters...</span><span x-show="advanced">Hide filters</span>
          </button>
          <span class="text-xs text-slate-500" x-text="`${filtered.length} / ${invocations.length} rows`"></span>
        </div>
        <div x-show="advanced" x-cloak class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3 pt-3 border-t border-slate-200 dark:border-slate-800 text-xs">
          <div>
            <div class="font-medium mb-1">Models</div>
            <div class="space-y-1">
              <template x-for="m in summary.models" :key="m.name">
                <label class="flex items-center gap-1.5">
                  <input type="checkbox" :value="m.name" x-model="filters.models" class="rounded" />
                  <span class="font-mono truncate" x-text="m.name"></span>
                </label>
              </template>
            </div>
          </div>
          <div>
            <div class="font-medium mb-1">Signatures</div>
            <div class="space-y-1 max-h-32 overflow-auto scrollbar-thin">
              <template x-for="s in summary.signatures" :key="s.name">
                <label class="flex items-center gap-1.5">
                  <input type="checkbox" :value="s.name" x-model="filters.signatures" class="rounded" />
                  <span x-text="s.name"></span>
                </label>
              </template>
            </div>
          </div>
          <div>
            <div class="font-medium mb-1">
              Min cost: $<span x-text="filters.minCost.toFixed(4)"></span>
            </div>
            <input type="range" min="0" :max="summary.maxCost || 1" step="0.0001" x-model.number="filters.minCost" class="w-full" />
            <div class="font-medium mb-1 mt-2">
              Time window (s from start): <span x-text="filters.timeMax.toFixed(2)"></span>
            </div>
            <input type="range" min="0" :max="summary.totalSpanSec || 1" step="0.1" x-model.number="filters.timeMax" class="w-full" />
          </div>
        </div>
      </section>

      <!-- Table + Detail layout -->
      <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">

        <!-- Table -->
        <div class="rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div class="max-h-[70vh] overflow-auto scrollbar-thin">
            <table class="w-full text-xs">
              <thead class="sticky top-0 bg-slate-100 dark:bg-slate-800 z-10">
                <tr>
                  <template x-for="col in columns" :key="col.key">
                    <th class="text-left px-2 py-1.5 font-medium cursor-pointer select-none whitespace-nowrap"
                        @click="sortBy(col.key)">
                      <span x-text="col.label"></span>
                      <span class="text-slate-400 ml-0.5"
                            x-text="sort.key === col.key ? (sort.dir === 'asc' ? '▲' : '▼') : ''"></span>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="(row, idx) in displayedRows" :key="row.seq">
                  <tr class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 trace-stripe"
                      :class="selectedSeq === row.seq ? 'row-selected' : ''"
                      :style="filters.groupByTrace ? `--stripe: ${traceColor(row.trace_id)};` : ''"
                      @click="select(row.seq)">
                    <td class="px-2 py-1 text-slate-400" x-text="row.seq"></td>
                    <td class="px-2 py-1 font-mono whitespace-nowrap" x-text="'+' + row.relSec.toFixed(3) + 's'"></td>
                    <td class="px-2 py-1 truncate max-w-[180px]" x-text="row.signature"></td>
                    <td class="px-2 py-1 font-mono text-[11px] truncate max-w-[180px]" x-text="row.model"></td>
                    <td class="px-2 py-1 text-right whitespace-nowrap" x-text="'$' + (row.cost || 0).toFixed(5)"></td>
                    <td class="px-2 py-1 text-right whitespace-nowrap" x-text="(row.tokens || 0).toLocaleString()"></td>
                    <td class="px-2 py-1 text-right whitespace-nowrap" x-text="fmtMs(row.latency)"></td>
                    <td class="px-2 py-1 whitespace-nowrap">
                      <span x-show="!row.error" class="px-1.5 py-0.5 rounded text-[10px] bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300">OK</span>
                      <span x-show="row.error" class="px-1.5 py-0.5 rounded text-[10px] bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300">ERR</span>
                    </td>
                  </tr>
                </template>
                <template x-if="displayedRows.length === 0">
                  <tr><td colspan="8" class="text-center py-8 text-slate-500">No rows match the current filters.</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Detail panel -->
        <aside class="rounded-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
          <template x-if="!selectedRow">
            <div class="p-10 text-center text-sm text-slate-500">
              Click a row to inspect inputs, outputs, tokens, and the raw record.
            </div>
          </template>
          <template x-if="selectedRow">
            <div class="max-h-[70vh] overflow-auto scrollbar-thin p-3 space-y-3">
              <div class="flex items-start gap-2">
                <div class="flex-1 min-w-0">
                  <div class="text-sm font-semibold" x-text="selectedRow.signature"></div>
                  <div class="text-xs text-slate-500 font-mono truncate" x-text="selectedRow.model"></div>
                </div>
                <div class="flex flex-col gap-1 text-[10px] text-right">
                  <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800" x-text="'#' + selectedRow.seq"></span>
                  <span class="px-1.5 py-0.5 rounded" :class="selectedRow.error ? 'bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300' : 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300'"
                        x-text="selectedRow.error ? 'ERROR' : 'OK'"></span>
                </div>
              </div>

              <div class="flex flex-wrap gap-1 text-[10px]">
                <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800">
                  cost <span class="font-mono" x-text="'$' + (selectedRow.cost || 0).toFixed(5)"></span>
                </span>
                <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800">
                  in <span class="font-mono" x-text="(selectedRow.inputTokens || 0).toLocaleString()"></span>
                </span>
                <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800">
                  out <span class="font-mono" x-text="(selectedRow.outputTokens || 0).toLocaleString()"></span>
                </span>
                <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800">
                  latency <span class="font-mono" x-text="fmtMs(selectedRow.latency)"></span>
                </span>
                <span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800">
                  codec <span class="font-mono" x-text="selectedRow.codec || '—'"></span>
                </span>
              </div>

              <div class="flex flex-wrap gap-2 text-[11px] items-center">
                <span class="text-slate-500">invocation_id</span>
                <code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 font-mono truncate max-w-[200px]" x-text="selectedRow.invocation_id || '—'"></code>
                <button class="text-slate-500 hover:text-indigo-500" @click="copy(selectedRow.invocation_id)" title="Copy">copy</button>
                <span class="text-slate-500 ml-2">trace_id</span>
                <code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 font-mono truncate max-w-[200px]" x-text="selectedRow.trace_id || '—'"></code>
                <button class="text-slate-500 hover:text-indigo-500" @click="copy(selectedRow.trace_id)" title="Copy">copy</button>
                <button class="text-slate-500 hover:text-indigo-500 ml-2" @click="filters.search=selectedRow.trace_id; filters.groupByTrace=true">filter group</button>
              </div>

              <template x-if="selectedRow.error">
                <div class="p-2 rounded bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 text-xs">
                  <div class="font-semibold mb-1">Error</div>
                  <pre class="json" x-text="selectedRow.error"></pre>
                </div>
              </template>

              <!-- Inputs / Outputs split -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Inputs</h3>
                    <button class="text-[10px] text-slate-500 hover:text-indigo-500" @click="copy(JSON.stringify(selectedRow.inputs, null, 2))">copy</button>
                  </div>
                  <div class="rounded p-2 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <template x-if="selectedRow.inputs">
                      <div class="space-y-2">
                        <template x-for="(val, key) in selectedRow.inputs" :key="key">
                          <div>
                            <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-0.5" x-text="key"></div>
                            <div x-html="renderField(val)"></div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!selectedRow.inputs">
                      <div class="text-xs text-slate-500 italic">(no inputs)</div>
                    </template>
                  </div>
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Outputs</h3>
                    <button class="text-[10px] text-slate-500 hover:text-indigo-500" @click="copy(JSON.stringify(selectedRow.outputs, null, 2))">copy</button>
                  </div>
                  <div class="rounded p-2 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <template x-if="selectedRow.outputs">
                      <div class="space-y-2">
                        <template x-for="(val, key) in selectedRow.outputs" :key="key">
                          <div>
                            <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-0.5" x-text="key"></div>
                            <div x-html="renderField(val)"></div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!selectedRow.outputs">
                      <div class="text-xs text-slate-500 italic">(no outputs)</div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Raw record -->
              <details class="rounded border border-slate-200 dark:border-slate-700">
                <summary class="text-xs px-2 py-1.5 cursor-pointer bg-slate-100 dark:bg-slate-800 select-none">Raw JSON record</summary>
                <pre class="json p-2 max-h-96 overflow-auto scrollbar-thin" x-html="highlightJson(selectedRow.raw)"></pre>
              </details>
            </div>
          </template>
        </aside>
      </section>

      <div class="text-[10px] text-slate-400 text-center mt-6 mb-2">
        kaos-agents Run Inspector · single-file static viewer · drop a JSONL anytime
      </div>
    </main>
  </template>

  <!-- ============================= PASTE MODAL ============================= -->
  <div x-show="pasteOpen" x-cloak class="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4" @click.self="pasteOpen=false">
    <div class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-lg p-4 border border-slate-200 dark:border-slate-700">
      <h2 class="font-semibold mb-2">Paste JSONL</h2>
      <textarea x-model="pasteText" rows="14" class="w-full text-xs font-mono bg-slate-50 dark:bg-slate-800 p-2 rounded border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder='{"kind":"header",...}&#10;{"kind":"invocation",...}'></textarea>
      <div class="flex justify-end gap-2 mt-3">
        <button class="text-sm px-3 py-1.5 rounded border border-slate-300 dark:border-slate-700" @click="pasteOpen=false">Cancel</button>
        <button class="text-sm px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white"
                @click="parseText(pasteText, '(pasted)'); pasteOpen=false">Load</button>
      </div>
    </div>
  </div>

  <script id="sample-jsonl" type="application/jsonl">

  <!-- ============================= VIEWER LOGIC ============================= -->
  <script>
    function viewer() {
      return {
        // ---- state ----
        records: [],
        invocations: [],
        header: null,
        trailer: null,
        fileName: '',
        loadError: '',
        urlHint: false,
        parseErrors: [],
        totalLines: 0,
        dragHover: false,
        pasteOpen: false,
        pasteText: '',
        advanced: false,
        theme: 'dark',

        selectedSeq: null,
        sort: { key: 'seq', dir: 'asc' },

        filters: {
          search: '',
          status: 'all',
          models: [],
          signatures: [],
          minCost: 0,
          timeMax: 0,
          groupByTrace: false,
        },

        columns: [
          { key: 'seq', label: '#' },
          { key: 'relSec', label: 'time' },
          { key: 'signature', label: 'signature' },
          { key: 'model', label: 'model' },
          { key: 'cost', label: 'cost' },
          { key: 'tokens', label: 'tokens' },
          { key: 'latency', label: 'latency' },
          { key: 'status', label: 'status' },
        ],

        // ---- lifecycle ----
        init() {
          this.theme = localStorage.getItem('kaos-viewer-theme') || 'dark';
          document.documentElement.classList.toggle('dark', this.theme === 'dark');
          const params = new URLSearchParams(window.location.search);
          const fileParam = params.get('file');
          if (fileParam) {
            this.urlHint = false;
            this.tryFetchFile(fileParam);
          }
        },

        async tryFetchFile(name) {
          try {
            const r = await fetch(name);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const text = await r.text();
            this.parseText(text, name);
          } catch (err) {
            this.urlHint = true;
            this.loadError = `Could not fetch "${name}": ${err.message}.`;
          }
        },

        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', this.theme === 'dark');
          localStorage.setItem('kaos-viewer-theme', this.theme);
        },

        reset() {
          this.records = []; this.invocations = []; this.header = null; this.trailer = null;
          this.fileName = ''; this.selectedSeq = null; this.loadError = ''; this.parseErrors = [];
          this.filters.search = ''; this.filters.models = []; this.filters.signatures = [];
          this.filters.minCost = 0; this.filters.timeMax = 0; this.filters.groupByTrace = false;
        },

        // ---- file loading ----
        onFile(ev) {
          const f = ev.target.files[0];
          if (f) this.readFile(f);
        },
        onDrop(ev) {
          this.dragHover = false;
          const f = ev.dataTransfer.files[0];
          if (f) this.readFile(f);
        },
        readFile(f) {
          this.fileName = f.name;
          if (f.size > 50 * 1024 * 1024) {
            this.loadError = `Warning: ${(f.size/1024/1024).toFixed(1)} MB file. Performance may degrade above 50 MB.`;
          }
          const reader = new FileReader();
          reader.onload = e => this.parseText(e.target.result, f.name);
          reader.onerror = () => { this.loadError = 'Failed to read file.'; };
          reader.readAsText(f);
        },
        loadSample() {
          const el = document.getElementById('sample-jsonl');
          this.parseText(el.textContent.trim(), 'sample.jsonl');
        },

        // ---- parsing ----
        parseText(text, name) {
          this.reset();
          this.fileName = name;
          const lines = text.split(/\r?\n/);
          this.totalLines = lines.length;
          const recs = [];
          const errs = [];
          let lineNo = 0;
          for (const line of lines) {
            lineNo++;
            if (!line.trim()) continue;
            try {
              recs.push(JSON.parse(line));
            } catch (err) {
              errs.push({ line: lineNo, error: err.message });
            }
          }
          this.records = recs;
          this.parseErrors = errs;
          this.header = recs.find(r => r.kind === 'header') || null;
          this.trailer = recs.find(r => r.kind === 'trailer') || null;
          // Build invocation rows.
          let seq = 0;
          const start = this.header
            ? new Date(this.header.start_ts_utc).getTime()
            : null;
          this.invocations = recs
            .filter(r => r.kind === 'invocation')
            .map(r => {
              seq++;
              const t = r.trace || {};
              const ts = t.timestamp ? new Date(t.timestamp).getTime() : null;
              const relSec = (ts && start) ? Math.max(0, (ts - start) / 1000) : 0;
              return {
                seq,
                raw: r,
                invocation_id: r.invocation_id,
                trace_id: t.trace_id || null,
                model: r.model || t.model || '—',
                signature: t.call_name || t.signature || '—',
                codec: t.codec || null,
                inputs: t.inputs || null,
                outputs: t.outputs || r.output || null,
                inputTokens: t.input_tokens || 0,
                outputTokens: t.output_tokens || 0,
                tokens: t.total_tokens || ((t.input_tokens || 0) + (t.output_tokens || 0)),
                cost: t.cost_usd || 0,
                latency: t.latency_ms || 0,
                error: r.error || (t.error ? String(t.error) : null),
                timestamp: ts,
                relSec,
              };
            });
          // Initialize time-window filter to the full range.
          if (this.invocations.length > 0) {
            const maxSec = Math.max(...this.invocations.map(r => r.relSec)) || 0;
            this.filters.timeMax = maxSec;
          }
        },

        // ---- summary stats ----
        get summary() {
          const inv = this.invocations;
          const totalCost = inv.reduce((s, r) => s + (r.cost || 0), 0);
          const totalTokens = inv.reduce((s, r) => s + (r.tokens || 0), 0);
          const totalLatencyMs = inv.reduce((s, r) => s + (r.latency || 0), 0);
          const errorCount = inv.filter(r => r.error).length;
          const traceIds = new Set(inv.map(r => r.trace_id).filter(Boolean));
          const modelMap = new Map();
          const sigMap = new Map();
          for (const r of inv) {
            modelMap.set(r.model, (modelMap.get(r.model) || 0) + 1);
            sigMap.set(r.signature, (sigMap.get(r.signature) || 0) + 1);
          }
          const sortByCount = (a, b) => b.count - a.count;
          const models = [...modelMap].map(([name, count]) => ({ name, count })).sort(sortByCount);
          const signatures = [...sigMap].map(([name, count]) => ({ name, count })).sort(sortByCount);
          const maxCost = Math.max(0, ...inv.map(r => r.cost || 0));
          const totalSpanSec = inv.length > 0 ? Math.max(...inv.map(r => r.relSec)) : 0;
          let timeRangeLabel = '—';
          if (inv.length > 0) {
            const tsList = inv.map(r => r.timestamp).filter(Boolean);
            if (tsList.length > 1) {
              const span = (Math.max(...tsList) - Math.min(...tsList)) / 1000;
              timeRangeLabel = (span < 1 ? span.toFixed(2) : span.toFixed(1)) + 's';
            } else {
              timeRangeLabel = 'single call';
            }
          }
          return {
            totalCost, totalTokens, totalLatencyMs, errorCount,
            traceCount: traceIds.size, models, signatures, maxCost, totalSpanSec,
            timeRangeLabel,
          };
        },

        // ---- filtering + sorting ----
        get filtered() {
          const f = this.filters;
          const q = (f.search || '').toLowerCase().trim();
          return this.invocations.filter(r => {
            if (f.status === 'ok' && r.error) return false;
            if (f.status === 'error' && !r.error) return false;
            if (f.models.length && !f.models.includes(r.model)) return false;
            if (f.signatures.length && !f.signatures.includes(r.signature)) return false;
            if ((r.cost || 0) < f.minCost) return false;
            if (r.relSec > (f.timeMax || Infinity)) return false;
            if (q) {
              const hay = JSON.stringify(r.inputs || {}) + ' ' + JSON.stringify(r.outputs || {}) + ' ' + (r.error || '') + ' ' + (r.trace_id || '');
              if (!hay.toLowerCase().includes(q)) return false;
            }
            return true;
          });
        },

        get displayedRows() {
          const rows = [...this.filtered];
          const { key, dir } = this.sort;
          const mult = dir === 'asc' ? 1 : -1;
          rows.sort((a, b) => {
            let av = a[key], bv = b[key];
            if (key === 'status') { av = a.error ? 1 : 0; bv = b.error ? 1 : 0; }
            if (av == null) av = '';
            if (bv == null) bv = '';
            if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * mult;
            return String(av).localeCompare(String(bv)) * mult;
          });
          // If grouping by trace, preserve the (stable) sort but cluster by trace_id.
          if (this.filters.groupByTrace) {
            const buckets = new Map();
            for (const r of rows) {
              const key = r.trace_id || '__none__';
              if (!buckets.has(key)) buckets.set(key, []);
              buckets.get(key).push(r);
            }
            return [...buckets.values()].flat();
          }
          return rows;
        },

        sortBy(key) {
          if (this.sort.key === key) this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
          else { this.sort.key = key; this.sort.dir = 'asc'; }
        },

        select(seq) { this.selectedSeq = seq; },

        get selectedRow() {
          return this.invocations.find(r => r.seq === this.selectedSeq) || null;
        },

        traceColor(traceId) {
          if (!traceId) return 'transparent';
          // Deterministic hash → hue.
          let h = 0;
          for (let i = 0; i < traceId.length; i++) h = (h * 31 + traceId.charCodeAt(i)) & 0xffffffff;
          const hue = Math.abs(h) % 360;
          return `hsl(${hue}, 70%, 55%)`;
        },

        // ---- rendering helpers ----
        fmtMs(ms) {
          if (!ms) return '—';
          if (ms < 1000) return Math.round(ms) + 'ms';
          return (ms / 1000).toFixed(2) + 's';
        },

        renderField(val) {
          // Redaction marker (kaos-agents in-process recorder shape).
          if (val && typeof val === 'object' && val._redacted === true) {
            const len = val.len_chars || '?';
            const hash = val.sha256 ? val.sha256.slice(0, 12) : '?';
            return `<div class="text-xs px-2 py-1 rounded bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 border border-amber-200 dark:border-amber-800">
                      <span class="font-medium">[REDACTED]</span>
                      ${len} chars · sha256 <code class="text-[10px]">${hash}…</code>
                    </div>`;
          }
          if (typeof val === 'string') {
            // env_recorder.py truncation sentinel — show the prefix + a redaction badge.
            if (/\.\.\. \[TRUNCATED \d+ chars; sha256=[0-9a-f]+\]$/.test(val)) {
              const m = val.match(/^([\s\S]*) \.\.\. \[TRUNCATED (\d+) chars; sha256=([0-9a-f]+)\]$/);
              if (m) {
                return `<div class="space-y-1">
                          <div class="text-xs whitespace-pre-wrap font-mono p-1 rounded bg-slate-100 dark:bg-slate-800">${this.escape(m[1])}</div>
                          <div class="text-[10px] px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 inline-block">
                            [TRUNCATED ${m[2]} chars] sha256 <code>${m[3].slice(0,12)}…</code>
                          </div>
                        </div>`;
              }
            }
            // Render as markdown if string contains newlines or markdown-ish markers.
            if (val.includes('\n') || /[*_`#|]/.test(val)) {
              const html = window.DOMPurify
                ? window.DOMPurify.sanitize(window.marked.parse(val))
                : this.escape(val).replace(/\n/g, '<br/>');
              return `<div class="markdown-body">${html}</div>`;
            }
            return `<div class="text-xs whitespace-pre-wrap">${this.escape(val)}</div>`;
          }
          if (val == null) return `<div class="text-xs italic text-slate-500">null</div>`;
          // Numbers / booleans.
          if (typeof val === 'number' || typeof val === 'boolean') {
            return `<div class="text-xs font-mono">${this.escape(String(val))}</div>`;
          }
          // Object / array.
          return `<pre class="json p-1 rounded bg-slate-100 dark:bg-slate-800">${this.highlightJson(val)}</pre>`;
        },

        highlightJson(val) {
          const text = typeof val === 'string' ? val : JSON.stringify(val, null, 2);
          return this.escape(text).replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)/gi,
            (match, str, colon, bool, num) => {
              if (str) {
                if (colon) return `<span class="json-key">${str}</span>${colon}`;
                return `<span class="json-str">${str}</span>`;
              }
              if (bool) {
                if (bool === 'null') return `<span class="json-null">null</span>`;
                return `<span class="json-bool">${bool}</span>`;
              }
              if (num) return `<span class="json-num">${num}</span>`;
              return match;
            });
        },

        escape(s) {
          return String(s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        },

        copy(s) {
          if (!s) return;
          navigator.clipboard?.writeText(typeof s === 'string' ? s : JSON.stringify(s));
        },

        // ---- keyboard nav ----
        onKey(e) {
          if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
            if (e.key === 'Escape') e.target.blur();
            return;
          }
          if (e.key === '/') {
            e.preventDefault();
            this.$refs.searchInput?.focus();
            return;
          }
          if (this.invocations.length === 0) return;
          if (e.key === 'ArrowDown' || e.key === 'j') {
            e.preventDefault();
            const rows = this.displayedRows;
            const idx = rows.findIndex(r => r.seq === this.selectedSeq);
            if (idx < rows.length - 1) this.selectedSeq = rows[idx + 1].seq;
            else if (idx === -1 && rows.length > 0) this.selectedSeq = rows[0].seq;
          } else if (e.key === 'ArrowUp' || e.key === 'k') {
            e.preventDefault();
            const rows = this.displayedRows;
            const idx = rows.findIndex(r => r.seq === this.selectedSeq);
            if (idx > 0) this.selectedSeq = rows[idx - 1].seq;
          } else if (e.key === 'Escape') {
            this.selectedSeq = null;
          }
        },
      };
    }
  </script>
