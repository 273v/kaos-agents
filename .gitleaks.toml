# gitleaks configuration for kaos-agents.
#
# Extends gitleaks' default ruleset; only adds narrow allowlist entries
# for synthetic test fixtures whose high-entropy strings would otherwise
# trip the ``generic-api-key`` detector. New entries MUST be scoped by
# (path + regex + commit + description) — never broaden a rule globally
# to silence one fixture.

[extend]
useDefault = true

[allowlist]
description = "Allowlist for synthetic test-fixture needles in the corpus stress suite."

# S10 needle (wrong-extension content-sniff scenario) — the needle is
# deliberately structured to look like an authorization secret because
# the test verifies the agent reads it AND cites it. Real auth secrets
# do not live in this file; the value is generated by the test, not a
# leak. The match is narrowed to the exact path + exact value so any
# OTHER high-entropy string in the same file still trips the detector.
[[allowlist.paths]]
description = "S10 synthetic needle (VAULT-X9-OMEGA)"
regexes = ['''Authorization code for vault access: VAULT-X9-OMEGA''']
paths = ['''tests/integration/test_corpus_stress_suite\.py''']
