# gitleaks configuration for kaos-agents.
#
# Extends gitleaks' default ruleset; only adds narrow allowlist entries
# for synthetic test fixtures whose high-entropy strings would otherwise
# trip the ``generic-api-key`` detector. New entries MUST be scoped by
# (path + regex + commit + description) — never broaden a rule globally
# to silence one fixture.

[extend]
useDefault = true

# Per gitleaks 8.x schema: [[allowlists]] is a top-level array of
# allowlist blocks. Each block has paths (list of path regexes) AND
# regexes (list of content regexes). When both are present, BOTH must
# match for the finding to be silenced — narrow by construction.

[[allowlists]]
description = "S10 synthetic needle (VAULT-X9-OMEGA) — wrong-extension scenario plants the literal string as the test ground-truth; not a real auth secret."
paths = [
    '''tests/integration/test_corpus_stress_suite\.py''',
]
regexes = [
    '''Authorization code for vault access: VAULT-X9-OMEGA''',
]
